# Runs on a tag like v1.2.3, or by hand. Runs ci.yml, whose firmware job builds ci600.fxup and ci600.bin and
# uploads them as a workflow artifact. A tag publishes them as release assets. The ESP's update.yaml downloads the
# .fxup from releases/latest.
name: release
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ci.yml's screens job asks for contents: write, and a called workflow gets no more than its caller gives. That
  # job doesn't run from here, and ci.yml keeps the others at read.
  ci:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: write
    secrets: inherit

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # all of history and the tags, for the changelog
      - uses: actions/download-artifact@v8
        with:
          name: ci600-firmware
      - name: Changelog, the commits since the last version tag
        run: |
          prev=$(git describe --tags --abbrev=0 --match 'v[0-9]*.[0-9]*.[0-9]*' --exclude 'v*[!0-9.]*' HEAD^ 2>/dev/null || true)
          git log --no-merges --format='- %s' ${prev:+$prev..}HEAD > notes.md
          cat notes.md
      # gh fails on a missing file, so there's no release without the .fxup. A re-run replaces the release's files.
      - name: The release, with the files CI built
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release edit "$TAG" --notes-file notes.md
            gh release upload "$TAG" ci600.fxup ci600.bin --clobber
          else
            gh release create "$TAG" ci600.fxup ci600.bin --title "$TAG" --notes-file notes.md --verify-tag
          fi
