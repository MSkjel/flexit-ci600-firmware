# Runs on a tag like v1.2.3, or by hand. Tests, then builds ci600.fxup and ci600.bin. A tag publishes them as
# release assets, a manual run uploads them as a workflow artifact. The ESP's update.yaml downloads the .fxup
# from releases/latest.
name: release
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    secrets: inherit

  # Built without ccache, the toolchain from the same cache as ci.yml's firmware job
  release:
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI600_FXUP_KEY: ${{ secrets.CI600_FXUP_KEY }}  # the bootloader's key, see tools/mkupdate.py
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # all of history and the tags, for the changelog
      - run: git submodule update --init --depth 1
      - uses: awalsh128/cache-apt-pkgs-action@v1.6.3
        with:
          packages: gcc-arm-none-eabi ccache
      - run: make -C hw
      - run: |
          pip install cryptography
          if [ "$GITHUB_REF_TYPE" = tag ]; then ver="--version ${GITHUB_REF_NAME#v}"; fi  # a manual run gets config.mk's version
          python3 tools/mkupdate.py $ver hw/build/ci600.bin ci600.fxup
          python3 tools/mkupdate.py --verify ci600.fxup hw/build/ci600.bin
          cp hw/build/ci600.bin ci600.bin
      - name: Changelog, the commits since the last version tag
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          prev=$(git describe --tags --abbrev=0 --match 'v[0-9]*.[0-9]*.[0-9]*' --exclude 'v*[!0-9.]*' HEAD^ 2>/dev/null || true)
          git log --no-merges --format='- %s' ${prev:+$prev..}HEAD > notes.md
          cat notes.md
      - if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          body_path: notes.md
          files: |
            ci600.fxup
            ci600.bin
      - if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: ci600-firmware
          path: |
            ci600.fxup
            ci600.bin
