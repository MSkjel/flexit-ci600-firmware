name: CI
on:
  push:
    branches: [main, dev]  # not tags, release.yml runs this for those. Other branches get it from their pull request.
  pull_request:
  workflow_call:

permissions:
  contents: read

# A new push cancels the older run on its branch or pull request, never a tag's. Under release.yml github.workflow
# is "release", so those runs have a group of their own.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  ESP_REF: main  # the esphome-flexit-modbus-server branch the link is tested against

# The apt packages and ccache's objects come from the cache, LVGL comes without its history. The timeouts stop a
# stalled package mirror early.
jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - run: pip install clang-format==23.1.3 ruff==0.17.1
      - run: make format-check

  # Its ci600.bin and ci600.fxup are what release.yml publishes
  firmware:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      HAS_FXUP_KEY: ${{ secrets.CI600_FXUP_KEY != '' }}  # pull requests from forks don't get the secret
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # the tags, for the version
      - run: git submodule update --init --depth 1
      - uses: ./.github/actions/apt
        with:
          packages: gcc-arm-none-eabi libnewlib-arm-none-eabi ccache
      - uses: ./.github/actions/ccache
        with:
          key: firmware
      - run: make -C hw
      - if: env.HAS_FXUP_KEY == 'true'
        run: pip install cryptography==50.0.2 cffi==2.1.1 pycparser==3.0
      # Only this step gets the key
      - name: The update stream, built and read back
        if: env.HAS_FXUP_KEY == 'true'
        env:
          CI600_FXUP_KEY: ${{ secrets.CI600_FXUP_KEY }}  # the bootloader's key, see tools/mkupdate.py
        run: |
          python3 tools/mkupdate.py hw/build/ci600.bin hw/build/ci600.fxup
          python3 tools/mkupdate.py --verify hw/build/ci600.fxup hw/build/ci600.bin
      - uses: actions/upload-artifact@v7
        with:
          name: ci600-firmware
          path: |
            hw/build/ci600.bin
            hw/build/ci600.fxup
      - run: ccache --show-stats

  # make check, and again with ASan and UBSan. The plain run makes the gallery for the screens job.
  test:
    name: ${{ matrix.san && 'sanitizers' || 'test' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        san: ["", "1"]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # the tags, for the version
      - run: git submodule update --init --depth 1
      - uses: actions/checkout@v7
        with:
          repository: MSkjel/esphome-flexit-modbus-server
          ref: ${{ env.ESP_REF }}
          path: esp
      - uses: ./.github/actions/apt
        with:
          packages: gcc-multilib g++-multilib ccache
      - run: pip install pyyaml==6.0.3 pillow==13.0.0
      - uses: ./.github/actions/ccache
        with:
          key: ${{ matrix.san && 'sanitizers' || 'test' }}
      - run: make -C sim check SAN=${{ matrix.san }} ESP_REPO=$GITHUB_WORKSPACE/esp
      - if: matrix.san == ''
        run: make -C sim gallery ESP_REPO=$GITHUB_WORKSPACE/esp
      - if: matrix.san == ''
        uses: actions/upload-artifact@v7
        with:
          name: screens
          path: sim/build/out/gallery
      - run: ccache --show-stats

  # Pushes the test job's gallery as the only commit on the screens branch, where the README gets its screens
  screens:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: screens
      cancel-in-progress: true
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: screens
          path: screens
      - working-directory: screens
        env:
          TOKEN: ${{ github.token }}
        run: |
          git init -q -b screens
          git add -A
          git -c user.name="github-actions[bot]" -c user.email="41898299+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "Screens from ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" screens
